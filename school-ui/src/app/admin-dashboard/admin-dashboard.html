<div class="container mt-4">
  <h2>All Courses</h2>
  <table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Course Name</th>
        <th>Description</th>
        <th>Price</th>
        <th style="width: 160px">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let course of courses">
        <td>{{ course.id }}</td>
        <td>{{ course.title }}</td>
        <td>{{ course.description }}</td>
        <td>{{ course.price }}</td>
        <td>
          <button class="btn btn-sm btn-primary me-2" (click)="openEditModal(course)">
            <i class="bi bi-pencil-square"></i> Edit
          </button>
          <button class="btn btn-sm btn-danger" (click)="onDelete(course.id)">
            <i class="bi bi-trash"></i> Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="courses.length === 0" class="text-muted mt-3">No courses found.</p>
</div>

<!-- 🟢 Edit Course Modal -->
<div
  class="modal fade"
  id="editCourseModal"
  tabindex="-1"
  aria-labelledby="editCourseModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="editCourseModalLabel">Edit Course</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <form #editForm="ngForm">
          <div class="mb-3">
            <label class="form-label">Course Name</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="selectedCourse.title"
              name="title"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea
              class="form-control"
              [(ngModel)]="selectedCourse.description"
              name="description"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Price</label>
            <input
              type="number"
              class="form-control"
              [(ngModel)]="selectedCourse.price"
              name="price"
              required
            />
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button
          type="button"
          class="btn btn-success"
          (click)="saveCourse()"
          data-bs-dismiss="modal"
        >
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
